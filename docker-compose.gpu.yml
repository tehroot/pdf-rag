# GPU override for the ColPali sidecar.
#
# Activates an NVIDIA GPU reservation on the colpali-server service. The
# matching env vars (COLPALI_DOCKERFILE=Dockerfile.cuda, COLPALI_DEVICE=cuda,
# COLPALI_DTYPE=bfloat16, optionally COLPALI_MODEL=vidore/colqwen2-v1.0) come
# from .env — this file only contains the GPU reservation, which compose
# can't express conditionally inside the main file.
#
# Prerequisites on the host:
#   1. NVIDIA driver visible to the OS (verify with `nvidia-smi`).
#   2. nvidia-container-toolkit installed and the docker runtime configured
#      (verify with `docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi`).
#
# Bring up the stack with this override active:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Or symlink so plain `docker compose up -d` picks it up automatically:
#   ln -s docker-compose.gpu.yml docker-compose.override.yml

services:
  colpali-server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
