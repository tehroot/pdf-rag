quarkus.application.name=pdf-rag-ingest-http

quarkus.index-dependency.core.group-id=org.hayden
quarkus.index-dependency.core.artifact-id=pdf-rag-ingest-core

quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# Streamable HTTP MCP servers must serve CORS preflight to browser-based agents.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${MCP_CORS_ORIGINS:*}

ingest.openwebui.base-url=${OPEN_WEBUI_BASE_URL:http://localhost:3000}
ingest.openwebui.api-key=${OPEN_WEBUI_API_KEY:}

# --- Upload ingest (POST /ingest/upload) -------------------------------------
# Quarkus's 10M default body cap dies on a two-PDF upload. This cap is the
# PRIMARY defence (413 while the body streams, before any application code);
# keep it equal to ingest.upload.max_request_bytes so a client can tell
# 413 (too big) from 507 (store full).
quarkus.http.limits.max-body-size=${UPLOAD_MAX_BODY_SIZE:2G}
# Multipart temp files spill here BEFORE the resource runs — it must be on the
# same filesystem/dataset as the document store root or every store degrades
# from an atomic rename to a full copy. Dot-prefixed so directory scans skip
# it. Compose sets UPLOAD_TMP_DIR=/documents/.tmp (the /documents mount);
# the bare-metal default matches core's INGEST_UPLOAD_ROOT default.
quarkus.http.body.uploads-directory=${UPLOAD_TMP_DIR:${user.home}/.pdf-rag-ingest/documents/.tmp}

# --- OpenAPI / Swagger UI -----------------------------------------------------
# Schema at /q/openapi ; interactive UI at /q/swagger-ui — both on the same
# ${PORT} as /mcp. Swagger UI is dev-mode-only unless always-include=true, which
# exposes it on the built/deployed server too. Note the CORS default above is
# open (*), so an always-on UI is reachable by anything that can hit the port —
# gate at the network layer, or flip always-include to false to keep it dev-only.
quarkus.smallrye-openapi.info-title=pdf-rag-ingest REST API
quarkus.smallrye-openapi.info-version=1.0-SNAPSHOT
quarkus.smallrye-openapi.info-description=Directory-ingest, job-status, and document-delete REST surface, served alongside the MCP /mcp endpoint.
quarkus.swagger-ui.always-include=${SWAGGER_UI_ALWAYS_INCLUDE:true}

# Non-file multipart fields (kb_name, subdir, metadata, ...). The Quarkus
# default is 2048 bytes, which silently 400s a metadata JSON object of any
# real size — the file parts are unaffected (they stream to disk), so this
# only bounds the form scalars.
quarkus.http.limits.max-form-attribute-size=${UPLOAD_MAX_FORM_ATTR_SIZE:64K}
