quarkus.application.name=pdf-rag-ingest-http

quarkus.index-dependency.core.group-id=org.hayden
quarkus.index-dependency.core.artifact-id=pdf-rag-ingest-core

quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# Streamable HTTP MCP servers must serve CORS preflight to browser-based agents.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${MCP_CORS_ORIGINS:*}

ingest.openwebui.base-url=${OPEN_WEBUI_BASE_URL:http://localhost:3000}
ingest.openwebui.api-key=${OPEN_WEBUI_API_KEY:}

# --- OpenAPI / Swagger UI -----------------------------------------------------
# Schema at /q/openapi ; interactive UI at /q/swagger-ui — both on the same
# ${PORT} as /mcp. Swagger UI is dev-mode-only unless always-include=true, which
# exposes it on the built/deployed server too. Note the CORS default above is
# open (*), so an always-on UI is reachable by anything that can hit the port —
# gate at the network layer, or flip always-include to false to keep it dev-only.
quarkus.smallrye-openapi.info-title=pdf-rag-ingest REST API
quarkus.smallrye-openapi.info-version=1.0-SNAPSHOT
quarkus.smallrye-openapi.info-description=Directory-ingest, job-status, and document-delete REST surface, served alongside the MCP /mcp endpoint.
quarkus.swagger-ui.always-include=${SWAGGER_UI_ALWAYS_INCLUDE:true}
