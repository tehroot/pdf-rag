#version=RHEL7
# Unattended CentOS 7.9 install for the Xeon Phi host VM (phi-host).
# Kernel stays at the GA 3.10.0-1160.el7: only the base and extras repos are used,
# and kernel packages are excluded from yum afterwards (mpss-modules is built for it).
text
url --url="http://vault.centos.org/7.9.2009/os/x86_64/"
repo --name=extras --baseurl=http://vault.centos.org/7.9.2009/extras/x86_64/
lang en_US.UTF-8
keyboard us
timezone America/New_York --isUtc
network --bootproto=dhcp --device=link --hostname=phi-host --activate
rootpw --lock
selinux --disabled
firewall --disabled
services --enabled=sshd
bootloader --append="console=ttyS0,115200 console=tty0"
zerombr
clearpart --all --initlabel
autopart --type=lvm
reboot

%packages
@core
pciutils
wget
bzip2
tar
python
net-tools
bridge-utils
nfs-utils
kernel-devel
gcc
make
%end

%post --log=/root/ks-post.log
mkdir -p /root/.ssh && chmod 700 /root/.ssh
cat > /root/.ssh/authorized_keys <<'KEYS'
# REPLACE: the public keys allowed to log in as root (one per line)
ssh-ed25519 AAAA...your-key... user@host
KEYS
chmod 600 /root/.ssh/authorized_keys
# CentOS 7 is end of life: point every repo at the vault, keep the kernel pinned
sed -i -e 's|^mirrorlist=|#mirrorlist=|' -e 's|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|' /etc/yum.repos.d/CentOS-*.repo
echo "exclude=kernel kernel-devel kernel-headers kernel-tools*" >> /etc/yum.conf
%end
