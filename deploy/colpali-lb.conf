# nginx load balancer in front of the ColPali sidecar pool.
# Runs as a container on the r530 in the pdf-rag compose network; pdf-rag-http
# points COLPALI_SIDECAR_URL at http://colpali-lb:8090.
#
# Each sidecar today serves ONE request at a time (the endpoint blocks its
# event loop), so per upstream: nginx queues the rest in the
# least_conn pool instead of stacking them on a busy sidecar, and /healthz
# stays answerable from an idle replica. Raise max_conns after the sidecar
# thread-pool change (docs/plans/sidecar-throughput-v1.md step 2).
#
# Responses are ~5 MB JSON per page (60 MB per 12-page batch): buffering off,
# generous timeouts, big bodies.

worker_processes 2;
events { worker_connections 256; }

http {
    access_log off;
    client_max_body_size 256m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;

    upstream colpali_pool {
        least_conn;
        # local sidecar on the r530 A4500
        server colpali-server:8090 max_fails=3 fail_timeout=30s;
        # big-dumb replicas (CMP 170HX x2). Add/remove lines to size the pool.
        server 192.168.1.45:8100 max_fails=3 fail_timeout=30s;   # colpali-0a GPU0
        server 192.168.1.45:8101 max_fails=3 fail_timeout=30s;   # colpali-0b GPU0
        server 192.168.1.45:8110 max_fails=3 fail_timeout=30s;   # colpali-1a GPU1
        server 192.168.1.45:8111 max_fails=3 fail_timeout=30s;   # colpali-1b GPU1
    }

    # Same replicas WITHOUT max_conns, for readiness probes: when every
    # replica is mid-batch, colpali_pool has "no live upstreams" and nginx
    # answers 502, which pdf-rag-http treats as sidecar-down (transient
    # requeue + backoff). Here a busy replica just times out after 2 s and
    # nginx tries the next one; a batch ends somewhere within a few tries.
    upstream colpali_health {
        server colpali-server:8090 max_fails=0;
        server 192.168.1.45:8100 max_fails=0;
        server 192.168.1.45:8101 max_fails=0;
        server 192.168.1.45:8110 max_fails=0;
        server 192.168.1.45:8111 max_fails=0;
    }

    server {
        listen 8090;

        location = /healthz {
            proxy_pass http://colpali_health;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 5;
        }
        location = /info    { proxy_pass http://colpali_health; proxy_read_timeout 2s; proxy_next_upstream_tries 5; }

        location / {
            proxy_pass http://colpali_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
