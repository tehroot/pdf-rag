# End-to-end stack for pdf-rag-ingest.
#
# Services:
#   qdrant         — vector store (pinned to v1.13.x)
#   llama-server   — text embeddings (bge-* models) via llama.cpp
#   colpali-server — page embeddings (ColPali / ColQwen2 / ColSmolVLM)
#   pdf-rag-http   — the Java MCP server (HTTP transport)
#
# Bring up with:
#   docker compose up -d qdrant llama-server colpali-server      # backend only
#   docker compose up -d                                         # whole stack
#
# Configuration: copy .env.example to .env and edit. All knobs in this file
# come from env vars; the bare `docker compose up` works once .env is in place.
#
# CPU vs GPU: this base file is CPU-only (sidecar builds Dockerfile.cpu, runs
# on `cpu`). A committed docker-compose.override.yml symlink → docker-compose.gpu.yml
# is auto-loaded by plain `docker compose`, which flips the sidecar to the CUDA
# build + GPU reservation — so on an NVIDIA host `docker compose up -d` is GPU
# by default. On a CPU host that override would fail (no nvidia runtime); bypass
# it with an explicit base file or the scripts (which pass explicit -f):
#   docker compose -f docker-compose.yml up -d     # CPU
#   scripts/up.sh           # CPU      scripts/up.sh --gpu     # GPU

services:
  qdrant:
    # Pinned to a known-good 1.13.x release. Bump deliberately after re-testing
    # the prefetch + rerank query API and binary quantization paths.
    image: qdrant/qdrant:v1.13.4
    container_name: pdf-rag-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"     # REST
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC (unused by us; exposed for tooling)
    volumes:
      - qdrant-data:/qdrant/storage
    # Bulk ingests fan RocksDB out across many segment files; the docker
    # default nofile limit (often 1024 soft) dies with "too many open files"
    # mid-upsert. 65536 is comfortable headroom for large KBs.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      # The qdrant image is debian-slim without wget; use a TCP probe via the
      # bash builtin /dev/tcp so we don't depend on a tool that may not exist.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  llama-server:
    # llama.cpp server. Mount a host directory of GGUF models and set
    # LLAMA_MODEL_FILE to the model file name (e.g., bge-small-en-v1.5-f16.gguf).
    # The /models mount is the host's ./models directory.
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: pdf-rag-llama
    # --parallel N serves N embedding requests concurrently (continuous
    # batching) — a single slot leaves a multi-core host idle and caps CPU
    # embedding around ~23 chunks/s. NOTE: --ctx-size is divided across slots
    # (8192 / 4 = 2048 per slot), so keep ctx-per-slot above the model's token
    # cap (512 for bge-*) when raising LLAMA_PARALLEL.
    command: >
      -m /models/${LLAMA_MODEL_FILE:-bge-small-en-v1.5-f16.gguf}
      --embeddings
      --host 0.0.0.0
      --port 8081
      --ctx-size ${LLAMA_CTX_SIZE:-8192}
      --parallel ${LLAMA_PARALLEL:-4}
      --cont-batching
    volumes:
      - ./models:/models:ro
    ports:
      - "${LLAMA_PORT:-8081}:8081"
    restart: unless-stopped
    healthcheck:
      # The llama.cpp:server image is debian-slim without wget; TCP-probe via bash.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Uncomment for GPU acceleration (requires nvidia-container-toolkit on host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  colpali-server:
    build:
      context: ./sidecar
      dockerfile: ${COLPALI_DOCKERFILE:-Dockerfile.cpu}
    container_name: pdf-rag-colpali
    ports:
      - "${COLPALI_PORT:-8090}:8090"
    environment:
      COLPALI_MODEL: ${COLPALI_MODEL:-vidore/colsmolvlm-v0.1}
      COLPALI_DEVICE: ${COLPALI_DEVICE:-cpu}
      COLPALI_DTYPE: ${COLPALI_DTYPE:-float32}
      COLPALI_MAX_BATCH_SIZE: ${COLPALI_MAX_BATCH_SIZE:-4}
      # Qwen3-VL-class models (tomoro handle): visual-token cap + attention
      # impl. Ignored by colpali-engine models.
      COLPALI_MAX_VISUAL_TOKENS: ${COLPALI_MAX_VISUAL_TOKENS:-1280}
      COLPALI_ATTN_IMPL: ${COLPALI_ATTN_IMPL:-sdpa}
    volumes:
      # Cache HF model downloads on the host so container restarts don't
      # re-fetch multi-GB checkpoints.
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped
    # Overrides the Dockerfile healthcheck only to stretch start_period:
    # first boot downloads a multi-GB checkpoint from HF, and pdf-rag-http
    # now waits for service_healthy — an "unhealthy" verdict during a slow
    # first download would block the whole stack. Failures inside
    # start_period don't count; ready:true flips healthy immediately.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys,json; d=json.loads(urllib.request.urlopen('http://localhost:8090/healthz',timeout=4).read()); sys.exit(0 if d.get('ready') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
    # For GPU acceleration, layer in docker-compose.gpu.yml — see that file
    # for the host-side prerequisites and activation commands.

  pdf-rag-http:
    build:
      context: .
      dockerfile: server-http/Dockerfile
    container_name: pdf-rag-http
    depends_on:
      qdrant:
        condition: service_healthy
      llama-server:
        condition: service_healthy
      # service_healthy = model loaded (sidecar reports ready:true), so a
      # stack restart can't start draining visual jobs against a sidecar
      # that's still loading — that fast-failed 130 queued jobs once.
      colpali-server:
        condition: service_healthy
    ports:
      - "${PDF_RAG_PORT:-8080}:8080"
    environment:
      # Backend selection
      INGEST_BACKEND: ${INGEST_BACKEND:-qdrant}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-auto}
      INGEST_DEFAULT_VISUAL_INDEX: "${INGEST_DEFAULT_VISUAL_INDEX:-true}"

      # Qdrant
      QDRANT_URL: http://qdrant:6333

      # Text embeddings (llama-server inside the compose network)
      EMBED_BASE_URL: http://llama-server:8081/v1
      EMBED_MODEL: ${EMBED_MODEL:-bge-small-en-v1.5}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-64}

      # Chunking — keep INGEST_CHUNK_SIZE_CHARS below the embedding model's
      # max sequence length when tokenized. bge-* models are 512 tokens hard,
      # and the default EMBED_MODEL here is bge-small: 1500 chars busts the cap
      # on dense technical text (llama-server rejects with "input too large"),
      # so the compose default is 700.
      INGEST_CHUNK_SIZE_CHARS: ${INGEST_CHUNK_SIZE_CHARS:-700}
      INGEST_CHUNK_OVERLAP_CHARS: ${INGEST_CHUNK_OVERLAP_CHARS:-200}

      # ColPali sidecar
      COLPALI_SIDECAR_URL: http://colpali-server:8090
      COLPALI_BATCH_SIZE: ${COLPALI_BATCH_SIZE:-4}

      # Async ingest queue — aggressively queue on CPU sidecars
      INGEST_ASYNC_THRESHOLD_PAGES: ${INGEST_ASYNC_THRESHOLD_PAGES:-5}
      INGEST_QUEUE_WORKERS: ${INGEST_QUEUE_WORKERS:-1}
      INGEST_QUEUE_PATH: /var/lib/pdf-rag-ingest/queue

      # Page-image storage (rendered PNGs for inspect_page)
      INGEST_PAGE_STORE_ROOT: /var/lib/pdf-rag-ingest/page-images

      # Fusion config
      FUSION_STRATEGY: ${FUSION_STRATEGY:-rrf}

      # Auth — pass through to the container as (possibly empty) strings. The
      # ${VAR:-} compose form substitutes empty if the host env var is unset,
      # which Quarkus's SmallRye Config accepts; leaving these out entirely
      # makes the @ConfigProperty injection fail at boot.
      QDRANT_API_KEY: ${QDRANT_API_KEY:- }
      EMBED_API_KEY: ${EMBED_API_KEY:- }
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:- }

      # Open WebUI base URL — only honored when INGEST_BACKEND includes openwebui.
      OPEN_WEBUI_BASE_URL: ${OPEN_WEBUI_BASE_URL:-http://localhost:3000}

      # MCP transport
      MCP_CORS_ORIGINS: ${MCP_CORS_ORIGINS:-*}
    volumes:
      - page-images:/var/lib/pdf-rag-ingest/page-images
      - ingest-queue:/var/lib/pdf-rag-ingest/queue
      # Host inbox for documents the agent can ingest via source_type=path.
      # Useful when a target URL is fronted by a CDN (akamai/cloudflare) that
      # rejects server-side fetches — scp/cp the file in, then say "ingest
      # /docs/<filename>.pdf" in the chat.
      - ${INGEST_INBOX:-./incoming}:/docs:ro
      # Broad host access for the REST directory-ingest surface: host paths
      # under $INGEST_HOST_ROOT appear inside the container at /host, so
      # POST /ingest/directory takes "directory": "/host/<path>". Defaults to
      # the invoking user's $HOME; set INGEST_HOST_ROOT=/ in .env to expose
      # the entire host filesystem (Linux only — macOS Docker Desktop doesn't
      # file-share "/"). Read-only, but remember the REST surface has no auth:
      # anything mounted here is indexable+searchable by whoever reaches :8080.
      # On Linux, set INGEST_HOST_MOUNT_OPTS=ro,rslave so NFS/SMB shares
      # (re)mounted on the host AFTER container creation stay visible; the
      # rprivate default freezes the mount table at creation time. (rslave
      # can't be the default here — macOS Docker Desktop rejects it.)
      - ${INGEST_HOST_ROOT:-${HOME}}:/host:${INGEST_HOST_MOUNT_OPTS:-ro}
    restart: unless-stopped

volumes:
  qdrant-data:
  hf-cache:
  page-images:
  ingest-queue:
